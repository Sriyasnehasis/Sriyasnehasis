<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="45%" stop-color="#0d1024"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffe0"/>
      <stop offset="55%" stop-color="#7dd3ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#00ffe0" stroke-width="0.4" opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="radarFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffe0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ffe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffe0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ffe0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="radarClip"><circle cx="700" cy="300" r="82"/></clipPath>
  </defs>

  <!-- base -->
  <rect width="900" height="440" rx="18" fill="url(#bg)"/>
  <rect width="900" height="440" rx="18" fill="url(#grid)"/>
  <ellipse cx="450" cy="95" rx="420" ry="90" fill="url(#heroGlow)"/>

  <!-- animated top scanline -->
  <rect x="0" y="-40" width="900" height="3" fill="#00ffe0" opacity="0.55">
    <animate attributeName="y" values="-10;440" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.1;0.55" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- outer animated border pulse -->
  <rect x="2" y="2" width="896" height="436" rx="16" fill="none" stroke="#00ffe0" stroke-width="1.2" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- HERO TITLE -->
  <text x="450" y="72" text-anchor="middle" font-size="42" font-weight="800" fill="url(#titleGrad)" filter="url(#titleGlow)" letter-spacing="4">
    SRIYA SNEHASIS
  </text>
  <text x="450" y="100" text-anchor="middle" font-size="15" fill="#9db4bd" letter-spacing="2">
    ML RESEARCHER &#8226; BACKEND DEVELOPER &#8226; DATA SCIENCE EXPLORER
  </text>

  <!-- small status chip top right -->
  <g transform="translate(770,28)">
    <rect width="108" height="26" rx="13" fill="#0c1a24" stroke="#144049"/>
    <circle cx="18" cy="13" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="17" font-size="11" fill="#34d399" font-weight="700">ONLINE</text>
  </g>

  <!-- divider -->
  <line x1="60" y1="122" x2="840" y2="122" stroke="#144049" stroke-width="1"/>

  <!-- scanning sweep line across banner (subtle, lower zone only) -->
  <rect x="0" y="150" width="900" height="34" fill="#00ffe0" opacity="0.05">
    <animate attributeName="y" values="140;420" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal panel -->
  <rect x="40" y="150" width="440" height="250" rx="10" fill="#050b16" stroke="#144049" stroke-width="1.2"/>
  <rect x="40" y="150" width="440" height="26" rx="10" fill="#0c1a24"/>
  <circle cx="58" cy="163" r="4" fill="#fb7185"/>
  <circle cx="72" cy="163" r="4" fill="#fbbf24"/>
  <circle cx="86" cy="163" r="4" fill="#34d399"/>
  <text x="260" y="167" text-anchor="middle" fill="#5c7a86" font-size="10">boot_sequence.log</text>

  <g font-size="13" fill="#7dd3c8">
    <text x="58" y="200">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; initializing sriya_core...
    </text>
    <text x="58" y="226">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; loading module: python_ml...
    </text>
    <text x="58" y="252">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.27;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; loading module: flask_backend...
    </text>
    <text x="58" y="278">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.39;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; connecting: postgres // mongodb...
    </text>
    <text x="58" y="304">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.51;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; mounting: numpy // pandas // opencv...
    </text>
    <text x="58" y="330">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.63;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; running diagnostics... [OK]
    </text>
    <text x="58" y="356" fill="#00ffe0" font-weight="700">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.75;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; STATUS: ALL SYSTEMS ONLINE &#10003;
    </text>
  </g>
  <rect x="58" y="370" width="9" height="14" fill="#00ffe0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- radar panel -->
  <circle cx="700" cy="300" r="82" fill="url(#radarFade)"/>
  <circle cx="700" cy="300" r="82" fill="none" stroke="#144049" stroke-width="1"/>
  <circle cx="700" cy="300" r="56" fill="none" stroke="#144049" stroke-width="1"/>
  <circle cx="700" cy="300" r="30" fill="none" stroke="#144049" stroke-width="1"/>
  <line x1="618" y1="300" x2="782" y2="300" stroke="#144049" stroke-width="1"/>
  <line x1="700" y1="218" x2="700" y2="382" stroke="#144049" stroke-width="1"/>

  <g clip-path="url(#radarClip)">
    <path d="M700 300 L700 218 A82 82 0 0 1 771 260 Z" fill="#00ffe0" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="0 700 300" to="360 700 300" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="732" cy="272" r="4" fill="#facc15" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="668" cy="328" r="4" fill="#fb7185" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="722" cy="336" r="3.5" fill="#60a5fa" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="1.1s"/>
  </circle>

  <text x="700" y="400" text-anchor="middle" fill="#5c7a86" font-size="10" letter-spacing="1">SCANNING_ENVIRONMENT</text>

  <!-- rising tech tags -->
  <g font-size="11" font-weight="700">
    <g fill="#facc15">
      <rect x="510" y="410" width="70" height="22" rx="11">
        <animate attributeName="y" values="410;150" dur="7s" repeatCount="indefinite" begin="0s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="0s"/>
      </rect>
      <text x="545" y="425" text-anchor="middle" fill="#0c1a24">
        <animate attributeName="y" values="425;165" dur="7s" repeatCount="indefinite" begin="0s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="0s"/>
        Python
      </text>
    </g>
    <g fill="#34d399">
      <rect x="560" y="410" width="76" height="22" rx="11">
        <animate attributeName="y" values="410;150" dur="7s" repeatCount="indefinite" begin="1.4s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="1.4s"/>
      </rect>
      <text x="598" y="425" text-anchor="middle" fill="#0c1a24">
        <animate attributeName="y" values="425;165" dur="7s" repeatCount="indefinite" begin="1.4s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="1.4s"/>
        MongoDB
      </text>
    </g>
    <g fill="#60a5fa">
      <rect x="486" y="410" width="70" height="22" rx="11">
        <animate attributeName="y" values="410;150" dur="7s" repeatCount="indefinite" begin="2.8s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="2.8s"/>
      </rect>
      <text x="521" y="425" text-anchor="middle" fill="#0c1a24">
        <animate attributeName="y" values="425;165" dur="7s" repeatCount="indefinite" begin="2.8s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="2.8s"/>
        OpenCV
      </text>
    </g>
    <g fill="#a78bfa">
      <rect x="614" y="410" width="58" height="22" rx="11">
        <animate attributeName="y" values="410;150" dur="7s" repeatCount="indefinite" begin="4.2s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="4.2s"/>
      </rect>
      <text x="643" y="425" text-anchor="middle" fill="#0c1a24">
        <animate attributeName="y" values="425;165" dur="7s" repeatCount="indefinite" begin="4.2s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="4.2s"/>
        AWS
      </text>
    </g>
    <g fill="#fb7185">
      <rect x="538" y="410" width="70" height="22" rx="11">
        <animate attributeName="y" values="410;150" dur="7s" repeatCount="indefinite" begin="5.6s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="5.6s"/>
      </rect>
      <text x="573" y="425" text-anchor="middle" fill="#0c1a24">
        <animate attributeName="y" values="425;165" dur="7s" repeatCount="indefinite" begin="5.6s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="5.6s"/>
        Docker
      </text>
    </g>
  </g>

  <!-- floating stars for extra polish -->
  <g fill="#ffffff">
    <circle cx="90" cy="55" r="1.1" opacity="0.5"/>
    <circle cx="150" cy="35" r="0.9" opacity="0.4"/>
    <circle cx="800" cy="60" r="1.2" opacity="0.5"/>
    <circle cx="850" cy="130" r="1" opacity="0.4"/>
    <circle cx="30" cy="140" r="1" opacity="0.4"/>
  </g>
</svg>
