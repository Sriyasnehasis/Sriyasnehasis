<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="55%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#05040d"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#00ffe0" stroke-width="0.4" opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="radarFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffe0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ffe0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="radarClip"><circle cx="700" cy="215" r="90"/></clipPath>
  </defs>

  <!-- base -->
  <rect width="900" height="380" rx="16" fill="url(#bg)"/>
  <rect width="900" height="380" rx="16" fill="url(#grid)"/>

  <!-- scanning sweep line across whole banner -->
  <rect x="0" y="-40" width="900" height="40" fill="#00ffe0" opacity="0.06">
    <animate attributeName="y" values="-40;380" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- header -->
  <text x="34" y="38" fill="#00ffe0" font-size="15" font-weight="700">SRIYA_OS</text>
  <text x="128" y="38" fill="#5c7a86" font-size="12">v2.0 :: NEURAL_BACKEND</text>
  <rect x="272" y="27" width="8" height="13" fill="#00ffe0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <circle cx="860" cy="32" r="5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="805" y="36" fill="#34d399" font-size="11" text-anchor="end">ONLINE</text>
  <line x1="24" y1="52" x2="876" y2="52" stroke="#1b3a44" stroke-width="1"/>

  <!-- terminal panel -->
  <rect x="30" y="76" width="430" height="270" rx="10" fill="#050b16" stroke="#144049" stroke-width="1.2"/>
  <rect x="30" y="76" width="430" height="26" rx="10" fill="#0c1a24"/>
  <circle cx="48" cy="89" r="4" fill="#fb7185"/>
  <circle cx="62" cy="89" r="4" fill="#fbbf24"/>
  <circle cx="76" cy="89" r="4" fill="#34d399"/>
  <text x="245" y="93" text-anchor="middle" fill="#5c7a86" font-size="10">boot_sequence.log</text>

  <g font-size="13" fill="#7dd3c8">
    <text x="48" y="130">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; initializing sriya_core...
    </text>
    <text x="48" y="156">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; loading module: python_ml...
    </text>
    <text x="48" y="182">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.27;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; loading module: flask_backend...
    </text>
    <text x="48" y="208">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.39;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; connecting: postgres // mongodb...
    </text>
    <text x="48" y="234">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.51;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; mounting: numpy // pandas // opencv...
    </text>
    <text x="48" y="260">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.63;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; running diagnostics... [OK]
    </text>
    <text x="48" y="286" fill="#00ffe0" font-weight="700">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.75;0.92;1" dur="12s" repeatCount="indefinite"/>
      &gt; STATUS: ALL SYSTEMS ONLINE ✓
    </text>
  </g>
  <rect x="48" y="300" width="9" height="14" fill="#00ffe0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- radar panel -->
  <circle cx="700" cy="215" r="90" fill="url(#radarFade)"/>
  <circle cx="700" cy="215" r="90" fill="none" stroke="#144049" stroke-width="1"/>
  <circle cx="700" cy="215" r="62" fill="none" stroke="#144049" stroke-width="1"/>
  <circle cx="700" cy="215" r="34" fill="none" stroke="#144049" stroke-width="1"/>
  <line x1="610" y1="215" x2="790" y2="215" stroke="#144049" stroke-width="1"/>
  <line x1="700" y1="125" x2="700" y2="305" stroke="#144049" stroke-width="1"/>

  <g clip-path="url(#radarClip)">
    <path d="M700 215 L700 125 A90 90 0 0 1 778 170 Z" fill="#00ffe0" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="0 700 215" to="360 700 215" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="735" cy="185" r="4" fill="#facc15" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="665" cy="245" r="4" fill="#fb7185" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="720" cy="255" r="3.5" fill="#60a5fa" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="1.1s"/>
  </circle>

  <text x="700" y="360" text-anchor="middle" fill="#5c7a86" font-size="10">SCANNING_ENVIRONMENT</text>

  <!-- rising tech tags -->
  <g font-size="11" font-weight="600">
    <g fill="#0c1a24">
      <rect x="0" y="0" width="70" height="20" rx="10" transform="translate(510,340)">
        <animateTransform attributeName="transform" type="translate" values="510,340;510,90" dur="7s" repeatCount="indefinite" begin="0s"/>
      </rect>
    </g>
    <g fill="#facc15">
      <rect x="510" y="340" width="70" height="20" rx="10">
        <animate attributeName="y" values="340;90" dur="7s" repeatCount="indefinite" begin="0s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="0s"/>
      </rect>
      <text x="545" y="354" text-anchor="middle" fill="#0c1a24">
        <animate attributeName="y" values="354;104" dur="7s" repeatCount="indefinite" begin="0s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="0s"/>
        Python
      </text>
    </g>
    <g fill="#34d399">
      <rect x="560" y="340" width="70" height="20" rx="10">
        <animate attributeName="y" values="340;90" dur="7s" repeatCount="indefinite" begin="1.4s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="1.4s"/>
      </rect>
      <text x="595" y="354" text-anchor="middle" fill="#0c1a24">
        <animate attributeName="y" values="354;104" dur="7s" repeatCount="indefinite" begin="1.4s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="1.4s"/>
        MongoDB
      </text>
    </g>
    <g fill="#60a5fa">
      <rect x="490" y="340" width="70" height="20" rx="10">
        <animate attributeName="y" values="340;90" dur="7s" repeatCount="indefinite" begin="2.8s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="2.8s"/>
      </rect>
      <text x="525" y="354" text-anchor="middle" fill="#0c1a24">
        <animate attributeName="y" values="354;104" dur="7s" repeatCount="indefinite" begin="2.8s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="2.8s"/>
        OpenCV
      </text>
    </g>
    <g fill="#a78bfa">
      <rect x="600" y="340" width="60" height="20" rx="10">
        <animate attributeName="y" values="340;90" dur="7s" repeatCount="indefinite" begin="4.2s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="4.2s"/>
      </rect>
      <text x="630" y="354" text-anchor="middle" fill="#0c1a24">
        <animate attributeName="y" values="354;104" dur="7s" repeatCount="indefinite" begin="4.2s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="4.2s"/>
        AWS
      </text>
    </g>
    <g fill="#fb7185">
      <rect x="540" y="340" width="70" height="20" rx="10">
        <animate attributeName="y" values="340;90" dur="7s" repeatCount="indefinite" begin="5.6s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="5.6s"/>
      </rect>
      <text x="575" y="354" text-anchor="middle" fill="#0c1a24">
        <animate attributeName="y" values="354;104" dur="7s" repeatCount="indefinite" begin="5.6s"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="7s" repeatCount="indefinite" begin="5.6s"/>
        Docker
      </text>
    </g>
  </g>
</svg>
