<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
