<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#eafbea"/>
      <stop offset="45%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#0d4429"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphereClip"><circle cx="450" cy="240" r="15"/></clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#0d1117"/>

  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 450 240;5 450 240;0 450 240;-5 450 240;0 450 240"
      keyTimes="0;0.25;0.5;0.75;1" dur="42s" repeatCount="indefinite"/>

    <path id="orbit1Full" d="M622.32,216.14 A170,68 -8 0,1 277.68,263.86 A170,68 -8 0,1 622.32,216.14" fill="none" stroke="#238636" stroke-width="1.1" opacity="0.4"/>
    <path id="orbit2Full" d="M755.13,290.65 A310,132 10 0,1 144.87,189.35 A310,132 10 0,1 755.13,290.65" fill="none" stroke="#238636" stroke-width="1.1" opacity="0.32"/>

    <circle cx="450" cy="240" r="34" fill="url(#coreGlow)">
      <animate attributeName="r" values="30;36;30" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="240" r="15" fill="url(#sphereGrad)" filter="url(#softGlow)"/>
    <g clip-path="url(#sphereClip)">
      <ellipse cx="450" cy="240" rx="15" ry="4.5" fill="none" stroke="#0d4429" stroke-width="0.8" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 450 240" to="360 450 240" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="450" cy="240" rx="4.5" ry="15" fill="none" stroke="#0d4429" stroke-width="0.8" opacity="0.35">
        <animateTransform attributeName="transform" type="rotate" from="0 450 240" to="360 450 240" dur="9s" repeatCount="indefinite" begin="-2.2s"/>
      </ellipse>
    </g>

    <g>
      <animateMotion dur="14s" repeatCount="indefinite" begin="0s" calcMode="linear"><mpath href="#orbit1Full"/></animateMotion>
      <circle r="6.5" fill="#3fb950" filter="url(#softGlow)"><animate attributeName="r" values="6;7;6" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="13" y="4" fill="#56d364" font-size="13" font-weight="600">Python</text>
    </g>
    <g>
      <animateMotion dur="14s" repeatCount="indefinite" begin="-4.67s" calcMode="linear"><mpath href="#orbit1Full"/></animateMotion>
      <circle r="6.5" fill="#56d364" filter="url(#softGlow)"><animate attributeName="r" values="6;7;6" dur="2.7s" repeatCount="indefinite" begin="0.6s"/></circle>
      <text x="13" y="4" fill="#7ee787" font-size="13" font-weight="600">FastAPI</text>
    </g>
    <g>
      <animateMotion dur="14s" repeatCount="indefinite" begin="-9.33s" calcMode="linear"><mpath href="#orbit1Full"/></animateMotion>
      <circle r="6.5" fill="#7ee787" filter="url(#softGlow)"><animate attributeName="r" values="6;7;6" dur="3s" repeatCount="indefinite" begin="1.2s"/></circle>
      <text x="13" y="4" fill="#a2eeaf" font-size="13" font-weight="600">React</text>
    </g>
    <g>
      <animateMotion dur="24s" repeatCount="indefinite" begin="0s" calcMode="linear"><mpath href="#orbit2Full"/></animateMotion>
      <circle r="7.5" fill="#2ea043" filter="url(#softGlow)"><animate attributeName="r" values="7;8.3;7" dur="3.2s" repeatCount="indefinite"/></circle>
      <text x="14" y="4" fill="#3fb950" font-size="13" font-weight="600">GPT-4 / GenAI</text>
    </g>
    <g>
      <animateMotion dur="24s" repeatCount="indefinite" begin="-8s" calcMode="linear"><mpath href="#orbit2Full"/></animateMotion>
      <circle r="7.5" fill="#26a641" filter="url(#softGlow)"><animate attributeName="r" values="7;8.3;7" dur="3.5s" repeatCount="indefinite" begin="0.8s"/></circle>
      <text x="14" y="4" fill="#56d364" font-size="13" font-weight="600">TensorFlow</text>
    </g>
    <g>
      <animateMotion dur="24s" repeatCount="indefinite" begin="-16s" calcMode="linear"><mpath href="#orbit2Full"/></animateMotion>
      <circle r="7.5" fill="#57ab5f" filter="url(#softGlow)"><animate attributeName="r" values="7;8.3;7" dur="3.8s" repeatCount="indefinite" begin="1.6s"/></circle>
      <text x="14" y="4" fill="#7ee787" font-size="13" font-weight="600">Firebase</text>
    </g>
  </g>
</svg>
