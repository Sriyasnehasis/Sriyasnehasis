<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56c2c2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#56c2c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#eafffb"/>
      <stop offset="45%" stop-color="#56c2c2"/>
      <stop offset="100%" stop-color="#1c4a4a"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphereClip"><circle cx="430" cy="170" r="14"/></clipPath>
  </defs>

  <rect x="0" y="0" width="860" height="340" fill="#0b0e14"/>

  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 430 170;4 430 170;0 430 170;-4 430 170;0 430 170"
      keyTimes="0;0.25;0.5;0.75;1" dur="42s" repeatCount="indefinite"/>

    <path id="orbit1" d="M571.9,152.46 A140,50 -8 0,1 288.1,187.54 A140,50 -8 0,1 571.9,152.46" fill="none" stroke="#3d5a63" stroke-width="1.1" opacity="0.5"/>
    <path id="orbit2" d="M685.9,204.54 A260,90 10 0,1 174.1,135.46 A260,90 10 0,1 685.9,204.54" fill="none" stroke="#3d5a63" stroke-width="1.1" opacity="0.38"/>

    <circle cx="430" cy="170" r="32" fill="url(#coreGlow)">
      <animate attributeName="r" values="28;34;28" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="170" r="14" fill="url(#sphereGrad)" filter="url(#softGlow)"/>
    <g clip-path="url(#sphereClip)">
      <ellipse cx="430" cy="170" rx="14" ry="4.2" fill="none" stroke="#1c4a4a" stroke-width="0.8" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 430 170" to="360 430 170" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="430" cy="170" rx="4.2" ry="14" fill="none" stroke="#1c4a4a" stroke-width="0.8" opacity="0.35">
        <animateTransform attributeName="transform" type="rotate" from="0 430 170" to="360 430 170" dur="9s" repeatCount="indefinite" begin="-2.2s"/>
      </ellipse>
    </g>

    <!-- Inner orbit: core day-to-day stack -->
    <g>
      <animateMotion dur="14s" repeatCount="indefinite" begin="0s" calcMode="linear"><mpath href="#orbit1"/></animateMotion>
      <circle r="6.2" fill="#eafffb" filter="url(#softGlow)"><animate attributeName="r" values="5.8;6.6;5.8" dur="2.4s" repeatCount="indefinite"/></circle>
      <rect x="10" y="-13" width="65" height="22" rx="11" fill="#101620" stroke="#2b3f47" stroke-width="1"/>
      <text x="22" y="3" fill="#eafffb" font-size="12.5" font-weight="600">Python</text>
    </g>
    <g>
      <animateMotion dur="14s" repeatCount="indefinite" begin="-4.67s" calcMode="linear"><mpath href="#orbit1"/></animateMotion>
      <circle r="6.2" fill="#8fe3d8" filter="url(#softGlow)"><animate attributeName="r" values="5.8;6.6;5.8" dur="2.7s" repeatCount="indefinite" begin="0.6s"/></circle>
      <rect x="10" y="-13" width="72" height="22" rx="11" fill="#101620" stroke="#2b3f47" stroke-width="1"/>
      <text x="22" y="3" fill="#8fe3d8" font-size="12.5" font-weight="600">FastAPI</text>
    </g>
    <g>
      <animateMotion dur="14s" repeatCount="indefinite" begin="-9.33s" calcMode="linear"><mpath href="#orbit1"/></animateMotion>
      <circle r="6.2" fill="#6fd0cb" filter="url(#softGlow)"><animate attributeName="r" values="5.8;6.6;5.8" dur="3s" repeatCount="indefinite" begin="1.2s"/></circle>
      <rect x="10" y="-13" width="132" height="22" rx="11" fill="#101620" stroke="#2b3f47" stroke-width="1"/>
      <text x="22" y="3" fill="#6fd0cb" font-size="12.5" font-weight="600">React / Next.js</text>
    </g>

    <!-- Outer orbit: applied AI + infra -->
    <g>
      <animateMotion dur="24s" repeatCount="indefinite" begin="0s" calcMode="linear"><mpath href="#orbit2"/></animateMotion>
      <circle r="7.2" fill="#56c2c2" filter="url(#softGlow)"><animate attributeName="r" values="6.8;8;6.8" dur="3.2s" repeatCount="indefinite"/></circle>
      <rect x="11" y="-14" width="117" height="24" rx="12" fill="#101620" stroke="#2b3f47" stroke-width="1"/>
      <text x="24" y="3" fill="#56c2c2" font-size="13" font-weight="600">GPT-4 / GenAI</text>
    </g>
    <g>
      <animateMotion dur="24s" repeatCount="indefinite" begin="-8s" calcMode="linear"><mpath href="#orbit2"/></animateMotion>
      <circle r="7.2" fill="#49aeae" filter="url(#softGlow)"><animate attributeName="r" values="6.8;8;6.8" dur="3.5s" repeatCount="indefinite" begin="0.8s"/></circle>
      <rect x="11" y="-14" width="95" height="24" rx="12" fill="#101620" stroke="#2b3f47" stroke-width="1"/>
      <text x="24" y="3" fill="#49aeae" font-size="13" font-weight="600">TensorFlow</text>
    </g>
    <g>
      <animateMotion dur="24s" repeatCount="indefinite" begin="-16s" calcMode="linear"><mpath href="#orbit2"/></animateMotion>
      <circle r="7.2" fill="#3d9a9a" filter="url(#softGlow)"><animate attributeName="r" values="6.8;8;6.8" dur="3.8s" repeatCount="indefinite" begin="1.6s"/></circle>
      <rect x="11" y="-14" width="80" height="24" rx="12" fill="#101620" stroke="#2b3f47" stroke-width="1"/>
      <text x="24" y="3" fill="#3d9a9a" font-size="13" font-weight="600">Firebase</text>
    </g>
    <g>
      <animateMotion dur="24s" repeatCount="indefinite" begin="-20s" calcMode="linear"><mpath href="#orbit2"/></animateMotion>
      <circle r="7.2" fill="#328787" filter="url(#softGlow)"><animate attributeName="r" values="6.8;8;6.8" dur="4.1s" repeatCount="indefinite" begin="2.1s"/></circle>
      <rect x="11" y="-14" width="65" height="24" rx="12" fill="#101620" stroke="#2b3f47" stroke-width="1"/>
      <text x="24" y="3" fill="#328787" font-size="13" font-weight="600">Docker</text>
    </g>
  </g>
</svg>
